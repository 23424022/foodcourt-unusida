services:
  - type: web
    name: foodcourt-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MUTASIKU_API_KEY
        sync: false
      - key: MUTASIKU_WALLET_ACCOUNT_ID
        sync: false
      - key: MUTASIKU_WEBHOOK_SECRET
        sync: false
      - key: MUTASIKU_REDIRECT_URL
        sync: false
